workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            echo "android folder missing - creating it..."
            flutter create . --platforms=android --project-name marching_band_app
          else
            echo "android folder already exists"
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    
